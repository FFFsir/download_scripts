[project]
name = "download-scripts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.12"
dependencies = [
    "earthengine-api>=1.7.35",
    "nicegui>=3.14.0",
    "pillow>=12.3.0",
    "rasterio>=1.5.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
dw-cli = "DynamicWorld.cli:main"
dw-web = "DynamicWorld.web:main"
se-cli = "SatelliteEmbedding.cli:main"
se-web = "SatelliteEmbedding.web:main"

[tool.uv]
package = true

[tool.setuptools]
packages = ["DynamicWorld", "SatelliteEmbedding"]
